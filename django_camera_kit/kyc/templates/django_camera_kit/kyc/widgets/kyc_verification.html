<div class="camera-kit-kyc" data-camera-kit-config="{{ widget.config_id }}">
  {{ widget.config|json_script:widget.config_id }}
  <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value != None %} value="{{ widget.value }}"{% endif %}{% include "django/forms/widgets/attrs.html" %}>
  <button type="button" class="btn btn-outline-primary camera-kit-kyc-trigger">
    {{ widget.trigger_label }}
  </button>
  <span class="camera-kit-kyc-status"></span>
</div>
