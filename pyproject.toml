[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-camera-kit"
version = "0.1.0"
description = "Document scanning and KYC face verification widgets for Django"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Paul Guindo", email = "paulguindo@altius-group.ch"},
    {name = "Altius Academy SNC"},
]
keywords = ["django", "camera", "document-scanner", "kyc", "identity-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Security",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/Altius-Academy-SNC/django-camera-kit"
Documentation = "https://altius-academy-snc.github.io/django-camera-kit"
Repository = "https://github.com/Altius-Academy-SNC/django-camera-kit"
Issues = "https://github.com/Altius-Academy-SNC/django-camera-kit/issues"

[project.optional-dependencies]
kyc = [
    "djangorestframework>=3.14",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
]
dev = [
    "djangorestframework>=3.14",
    "pgvector>=0.2",
    "psycopg[binary]>=3.1",
    "pytest",
    "pytest-django",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_camera_kit*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
